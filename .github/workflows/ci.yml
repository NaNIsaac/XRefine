name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # genx3 needs wxPython, which ships wheels for Windows but must be built from source on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.13
      - run: uv run --with pytest pytest -q
