# XRefine Configuration File (v2.4 - Metal/Absorption Support & Target Focused)
# ==============================================================================

# [General Settings]
experiment_name: "XRefine_ViT_Metal_v1"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 15.0
q_len: 3000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# =============================================================================
# [Sample Configuration]
# =============================================================================
sample:
  # 1. Global / Instrumental Parameters (Nuisance)
  # 범위는 넉넉하게 잡되, 가중치를 낮춰서 피팅 보조용으로만 사용
  L: [5.0, 25.0]
  beam_width: [0.01, 0.3]
  bkg: [-10.0, -5.0]
  i0: [0.8, 1.2]
  dq: [0.0005, 0.005]
  tth_offset: [-0.03, 0.03]

  # 2. Substrate (Nuisance)
  substrate:
    name: "Substrate"
    roughness: [0.0, 8.0]
    sld: [18.0, 22.0]       # Si ~20
    sld_imag: [0.0, 1.0]    # 기판은 보통 흡수가 적음 (Si ~0.17)

  # 3. Layers (Top -> Bottom)
  layers:
    - name: "Top_Layer"       # Thin Top Layer (Contamination/Oxide)
      thickness: [0.0, 50.0]  # 얇은 층 가정
      roughness: [0.0, 10.0]
      sld: [0.0, 50.0]        # 유기물~산화물 수준
      sld_imag: [0.0, 1.0]    # 오염 물질은 흡수가 거의 없음
      repeats: 1

    - name: "Target_Film"     # [MAIN GOAL] Main Film
      thickness: [10.0, 1200.0] # 박막 범위 확장
      roughness: [0.0, 30.0]
      # SLD Real: 0(유기물) ~ 130(금/백금)까지 모든 금속 커버
      sld: [0.0, 130.0]       
      # SLD Imag: 0(투명) ~ 12.0(강한 흡수)까지 현실적 모든 물질 커버
      sld_imag: [0.0, 12.0]   
      repeats: 1

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.02
  bg_range: [-10.0, -6.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"
  measure_step_range: [0.001, 0.1]

# [Training Hyperparameters]
train:
  batch_size: 512
  lr: 0.002
  weight_decay: 1.0e-4
  epochs: 300
  steps_per_epoch: 20
  warmup_steps: 200
  
  sup_w_start: 10000.0
  sup_w_end: 100.0
  phys_penalty_w: 1.0

  # Loss Component Weights
  w_linear: 20.0
  w_gradient: 50.0
  w_log_base: 50.0
  
  # ===========================================================================
  # [Focus Strategy] Target Film Priority Weights
  # ===========================================================================
  weights:
    
    specific_layer_weights:
      Target_Film:
        thickness: 200.0  # [Highest Priority] 프린지 주기를 결정하는 핵심
        sld: 100.0        # [High Priority] 임계각 및 진폭 결정
        sld_imag: 50.0    # [High Priority] 기울기 및 감쇠 형상 결정
        roughness: 20.0   # [Medium Priority] 고각도 감쇠 결정 (중요도 상향)
        
      Top_Layer:          # Nuisance: 틀려도 크게 상관없음 (가중치 낮춤)
        thickness: 0.5    
        roughness: 0.5    
        sld: 0.5
        sld_imag: 0.1     # 거의 무시
        
      Substrate:          # Nuisance
        roughness: 0.5    
        sld: 1.0          # 기준점이므로 너무 낮추진 않음
        sld_imag: 0.1
    
    global_weights:       # Nuisance: 피팅을 위한 보정값일 뿐임
      i0: 1.0
      bkg: 1.0
      L: 0.1
      beam_width: 0.1
      dq: 1.0
      tth_offset: 1.0

# =============================================================================
# [Model Architecture]
# =============================================================================
model:
  model_type: "cnn"       # [중요] vit -> cnn 변경
  
  # CNN Hyperparameters
  hidden_dim: 256         # 시작 채널 수 (128~256 추천)
  encoder_depth: 6        # 레이어 깊이 (4~8 추천)
  
  # Fourier Features (XRR의 고주파 Fringe를 잡는 핵심)
  mapping_size: 64        # 0이면 일반 CNN, 64면 Fourier-CNN (필수!)
  fourier_scale: 40.0     # 주파수 스케일 (보통 20~50 사이)
  
  # MLP Head
  dim_feedforward: 1024   # 마지막 추론 레이어 크기
  dropout: 0.1            # 과적합 방지
  activation: "leaky_relu" # CNN은 보통 ReLU 계열 사용