# XRefine Configuration File
# ==========================

# [General Settings]
experiment_name: "temp"
# save_root: "C:\\Warehouse\\data\\XRR_AI\\transformer"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 15.0
q_len: 3000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# [Physical Ranges] - ParamSet과 1:1 매칭
ranges:
  d_f: [10.0, 1000.0]
  sig_f: [0.5, 20.0]
  rho_f: [5.0, 100.0]
  d_ox: [1.0, 50.0]
  sig_ox: [0.5, 10.0]
  rho_ox: [14.0, 20.0]
  
  # Instrumental Ranges
  L: [9.0, 15.0]
  beam_width: [0.01, 0.3]
  bkg: [-9.0, -4.0]
  i0: [0.8, 1.2]
  dq: [0.0005, 0.01]        # Resolution [A^-1]
  tth_offset: [-0.05, 0.05] # 2theta offset [deg]
  
  rho_sub: [19.0, 21.1]    # Substrate SLD (Si ~20.1, ±1)
  sig_sub: [0.5, 5.0]       # Substrate roughness [Å]

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.2
  bg_range: [-9.0, -5.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"
  measure_step_range: [0.001, 0.1]

# [Training Hyperparameters]
train:
  batch_size: 64
  lr: 0.0005177
  weight_decay: 1.0e-4
  epochs: 300
  steps_per_epoch: 100
  warmup_steps: 1000
  
  # Curriculum & Physics Loss
  sup_w_start: 10000.0
  sup_w_end: 2000.0
  phys_penalty_w: 0.8579

  # Parameter-specific Weights
weights:
  # ==========================================
  # [Tier 0] 절대 존엄 (Alignment & Scaling)
  # ==========================================
  # 축이 틀어지면 모든 물리 법칙이 깨집니다. 가장 강력하게 보정합니다.
  i0: 5.0           # Y축 스케일 (Intensity). 전체 형상 결정.

  # ==========================================
  # [Tier 1] 핵심 타겟 (Target Parameters)
  # ==========================================
  # 우리가 XRR을 찍는 진짜 목적입니다.
  d_f: 5.0          # 박막 두께 (Fringe 주기에 직결)
  rho_f: 3.0        # 박막 밀도 (임계각 및 진폭 결정)
  sig_f: 3.0        # 박막 거칠기 (Decay 기울기 결정)
  d_ox: 3.0         # 산화막 두께 (얇아도 간섭 패턴에 영향 줌)

  # ==========================================
  # [Tier 2] 보조 타겟 (Secondary)
  # ==========================================
  # 구분하기 어렵거나(Entanglement), 과적합 위험이 있는 변수들입니다.
  rho_ox: 1.5       # 박막이 얇으면 밀도 구분이 매우 모호함
  sig_ox: 1.0       # 가장 맞추기 힘든 변수. 너무 높이면 노이즈를 피팅함
  bkg: 1.0          # 배경 노이즈 레벨 (로그 스케일이라 1.0이면 충분)
  tth_offset: 1

  # ==========================================
  # [Tier 3] Nuisance Parameters (Ignore)
  # ==========================================
  # "입력은 랜덤하게 흔들지만, 맞췄는지 검사하지 않음"
  # 모델이 이 값들에 의존하지 않고 두께를 맞추도록 강제합니다 (Robustness).
  
  # 1. 기판 (Substrate): 박막 밑에 있어 거의 안 보임
  rho_sub: 0.0      
  sig_sub: 0.0      

  # 2. 기기 특성 (Instrument): 박막 물성과 섞이는(Degenerate) 변수들
  dq: 0.0           # Resolution (거칠기와 구분이 안 됨 -> 무시)
  L: 0.0            # Footprint (저각 영역만 영향 -> 무시)
  beam_width: 0.0   # (상동)

# [Model Architecture]
model:
  # --- Core Setting ---
  model_type: "transformer"  # Options: "transformer" or "cnn"
  
  # --- Common ---
  hidden_dim: 128       # Transformer: d_model / CNN: Base Channels
  encoder_depth: 4      # Transformer: Layers  / CNN: Depth
  fourier_scale: 43.0   # Fourier Feature Scale (Highly Sensitive)
  mapping_size: 64      # Fourier Dimension
  n_layers: 1           # Number of film layers
  
  # --- Transformer Specific ---
  n_heads: 4
  dim_feedforward: 512
  dropout: 0.1
  activation: "gelu"
  
  # --- CNN Specific (Legacy Support) ---
  kernel_size: 21
  dilation: 2
  n_channels: 128