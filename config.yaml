# XRefine Configuration File
# ==========================

# [General Settings]
experiment_name: "temp"
# save_root: "C:\\Warehouse\\data\\XRR_AI\\transformer"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 15.0
q_len: 3000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# [Physical Ranges] - ParamSet과 1:1 매칭
ranges:
  d_f: [10.0, 1000.0]
  sig_f: [0.5, 20.0]
  rho_f: [5.0, 100.0]
  d_ox: [1.0, 50.0]
  sig_ox: [0.5, 10.0]
  rho_ox: [14.0, 20.0]
  
  # Instrumental Ranges
  L: [9.0, 15.0]
  beam_width: [0.01, 0.3]
  bkg: [-9.0, -4.0]
  i0: [0.8, 1.2]
  dq: [0.0005, 0.01]        # Resolution [A^-1]
  tth_offset: [-0.05, 0.05] # 2theta offset [deg]
  
  rho_sub: [19.0, 21.1]    # Substrate SLD (Si ~20.1, ±1)
  sig_sub: [0.5, 5.0]       # Substrate roughness [Å]

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.2
  bg_range: [-9.0, -5.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"
  measure_step_range: [0.001, 0.1]

# [Training Hyperparameters]
train:
  batch_size: 64
  lr: 0.0005177
  weight_decay: 1.0e-4
  epochs: 300
  steps_per_epoch: 100
  warmup_steps: 1000
  
  # Curriculum & Physics Loss
  sup_w_start: 1000.0
  sup_w_end: 1
  phys_penalty_w: 0.8579

  # Loss Component Weights (Reconstruction)
  w_linear: 100.0    # I0/Critical Angle 집중
  w_gradient: 100.0   # Fringe 패턴/두께 집중
  w_log_base: 10.0   # 전체적인 경향성

  # Parameter-specific Weights
weights:

  i0: 1.0
  d_f: 10.0
  rho_f: 5.0
  sig_f: 5.0
  d_ox: 1.0

  rho_ox: 1.0
  sig_ox: 1.0
  bkg: 1.0
  tth_offset: 0
  rho_sub: 0.0      
  sig_sub: 0.0      

  dq: 0.0
  L: 0.0
  beam_width: 0.0

# =============================================================================
# [Model Architecture]
# =============================================================================
model:
  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ model_type: 사용할 모델 종류                                               │
  # │  - "vit"        : Vision Transformer (패치 + Fourier, 권장)               │
  # │  - "transformer": Transformer-VAE (Fourier만)                             │
  # │  - "cnn"        : Fourier-CNN (레거시)                                    │
  # └──────────────────────────────────────────────────────────────────────────┘
  model_type: "vit"
  
  # ───────────────────────────────────────────────────────────────────────────
  # 공통 설정 (모든 모델)
  # ───────────────────────────────────────────────────────────────────────────
  hidden_dim: 256       # 임베딩/채널 차원
  encoder_depth: 6      # Transformer/CNN 레이어 수
  n_layers: 1           # 예측할 박막 층 수
  dropout: 0.15         # 드롭아웃 비율
  
  # ───────────────────────────────────────────────────────────────────────────
  # Fourier Feature 설정 (ViT, Transformer 공통)
  # ───────────────────────────────────────────────────────────────────────────
  # mapping_size: Fourier 차원 수 (0 = Fourier 비활성화)
  #   - 높을수록 표현력 증가, 계산량 증가
  #   - 권장: 64~128
  mapping_size: 96
  
  # fourier_scale: 랜덤 주파수의 스케일
  #   - 높을수록 고주파(미세 Fringe) 포착
  #   - 낮을수록 저주파(부드러운 곡선) 포착
  #   - 권장: 30~60
  fourier_scale: 50.0
  
  # ───────────────────────────────────────────────────────────────────────────
  # Transformer/ViT 공통 설정
  # ───────────────────────────────────────────────────────────────────────────
  n_heads: 8            # Attention Head 수 (hidden_dim / n_heads = head_dim)
  dim_feedforward: 1024 # FFN 확장 차원 (보통 hidden_dim * 4)
  activation: "gelu"    # 활성화 함수 (gelu, relu)
  
  # ───────────────────────────────────────────────────────────────────────────
  # ViT 전용 설정
  # ───────────────────────────────────────────────────────────────────────────
  patch_size: 16        # 패치 크기 (16 Q-포인트를 하나의 토큰으로)
  
  # ───────────────────────────────────────────────────────────────────────────
  # CNN 전용 설정 (레거시)
  # ───────────────────────────────────────────────────────────────────────────
  kernel_size: 21
  dilation: 2
  n_channels: 128