# [General Settings]
experiment_name: "v1"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 12.0
q_len: 2000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# [Physical Ranges] - ParamSet과 1:1 매칭
ranges:
  d_f: [10.0, 1000.0]
  sig_f: [0.5, 20.0]
  rho_f: [5.0, 100.0]
  d_ox: [1.0, 50.0]
  sig_ox: [0.5, 10.0]
  rho_ox: [14.0, 20.0]
  L: [9.0, 15.0]
  beam_width: [0.01, 0.3]
  bkg: [-9.0, -4.0]
  i0: [0.8, 1.2]
  substrate_sld: 20.1

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.2
  bg_range: [-9.0, -5.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"

# [Training Hyperparameters]
train:
  batch_size: 64
  lr: 0.0005177043421596389
  epochs: 300
  steps_per_epoch: 100
  sup_w_start: 10000.0
  sup_w_end: 2000.0
  phys_penalty_w: 0.8578632881974889

  weights:
    d_f: 3.0
    sig_f: 3.0
    rho_f: 3.0
    d_ox: 2
    sig_ox: 1
    rho_ox: 2
    i0: 3.0
    bkg: 1.0
    L: 2.0
    beam_width: 2

# [Model Architecture]
model:
  encoder_depth: 6
  n_channels: 128
  kernel_size: 21
  dilation: 2
  fourier_scale: 42.99665209061587
  mapping_size: 64
  hidden_dim: 1024
  n_layers: 1