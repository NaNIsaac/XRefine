# XRefine Configuration File
# ==========================

# [General Settings]
experiment_name: "temp"
# save_root: "C:\\Warehouse\\data\\XRR_AI\\transformer"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 15.0
q_len: 3000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# [Physical Ranges] - ParamSet과 1:1 매칭
ranges:
  d_f: [10.0, 1000.0]
  sig_f: [0.5, 20.0]
  rho_f: [5.0, 100.0]
  d_ox: [1.0, 50.0]
  sig_ox: [0.5, 10.0]
  rho_ox: [14.0, 20.0]
  
  # Instrumental Ranges
  L: [9.0, 15.0]
  beam_width: [0.01, 0.3]
  bkg: [-9.0, -4.0]
  i0: [0.8, 1.2]
  dq: [0.0005, 0.01]        # Resolution [A^-1]
  tth_offset: [-0.05, 0.05] # 2theta offset [deg]
  
  rho_sub: [19.0, 21.1]    # Substrate SLD (Si ~20.1, ±1)
  sig_sub: [0.5, 5.0]       # Substrate roughness [Å]

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.2
  bg_range: [-9.0, -5.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"
  measure_step_range: [0.001, 0.1]

# [Training Hyperparameters]
train:
  batch_size: 64
  lr: 0.0005177
  weight_decay: 1.0e-4
  epochs: 300
  steps_per_epoch: 100
  warmup_steps: 1000
  
  # Curriculum & Physics Loss
  sup_w_start: 10000.0
  sup_w_end: 2000.0
  phys_penalty_w: 0.8579

  # Parameter-specific Weights
weights:

  i0: 1.0
  d_f: 5.0
  rho_f: 5.0
  sig_f: 5.0
  d_ox: 1.0

  rho_ox: 1.0
  sig_ox: 1.0
  bkg: 1.0
  tth_offset: 0
  rho_sub: 0.0      
  sig_sub: 0.0      

  dq: 0.0
  L: 0.0
  beam_width: 0.0

# [Model Architecture]
model:
  # --- Core Setting ---
  model_type: "vit"  # Options: "vit", "transformer", or "cnn"
  
  # --- Common ---
  hidden_dim: 256       # d_model (128 -> 256)
  encoder_depth: 6      # Layers (4 -> 6)
  n_layers: 1           # Number of film layers
  
  # --- ViT/Transformer Shared ---
  n_heads: 8            # Attention Heads (4 -> 8)
  dim_feedforward: 1024 # FFN expansion (512 -> 1024)
  dropout: 0.15         # (0.1 -> 0.15)
  activation: "gelu"
  
  # --- ViT Specific ---
  patch_size: 16        # Each patch = 16 Q-points
  
  # --- Transformer Specific (Fourier Features) ---
  fourier_scale: 50.0   # (43 -> 50)
  mapping_size: 96      # (64 -> 96)
  
  # --- CNN Specific (Legacy Support) ---
  kernel_size: 21
  dilation: 2
  n_channels: 128