# XRefine Configuration File (v2.0 - Dynamic Layers)
# ====================================================

# [General Settings]
experiment_name: "XRefine_ViT_Dynamic_v1"
save_root: "D:\\03_Resources\\Data\\XRR_AI\\xrefine"
log_dir: "logs"
device: "cuda"

# [Measurement Specs]
q_min_tth: 0.05
q_max_tth: 15.0
q_len: 3000

# [Instrument Hardware]
instrument:
  wavelength: 1.5406
  beam_width: 0.1
  res: 0.002
  I0: 1.0
  Ibkg_init: 1.0e-07

# =============================================================================
# [Sample Configuration] - The New Dynamic System
# =============================================================================
# Stack Order: Top (Surface) -> Bottom (Substrate)
sample:
  # 1. Global / Instrumental Parameters (Sample-specific)
  L: [9.0, 15.0]             # Sample Length [mm]
  beam_width: [0.01, 0.3]    # Effective Beam Width [mm]
  bkg: [-9.0, -4.0]          # Log10 Background
  i0: [0.8, 1.2]             # Intensity Scale
  dq: [0.0005, 0.01]         # Resolution [A^-1]
  tth_offset: [-0.05, 0.05]  # 2theta offset [deg]

  # 2. Substrate
  substrate:
    name: "Si"
    roughness: [0.5, 5.0]    # Interface roughness (Film/Sub)
    sld: [19.0, 21.1]        # Si ~20.1

  # 3. Layers (Ordered Top to Bottom)
  layers:
    - name: "Oxide"          # Top Layer (e.g. SiO2)
      thickness: [1.0, 50.0]
      roughness: [0.5, 10.0] # Interface roughness (Amb/Oxide)
      sld: [14.0, 20.0]
      repeats: 1

    - name: "Film"           # Main Film
      thickness: [10.0, 1000.0]
      roughness: [0.5, 20.0] # Interface roughness (Oxide/Film)
      sld: [5.0, 100.0]
      repeats: 1

# [Augmentation Config]
augmentations:
  intensity_noise_scale: 0.05
  bg_range: [-9.0, -5.0]
  res_sigma_range: [0.0001, 0.005]
  q_shift_sigma: 0.001
  beam_profile: "gaussian"
  measure_step_range: [0.001, 0.1]

# [Training Hyperparameters]
train:
  batch_size: 32
  lr: 0.0005
  weight_decay: 1.0e-4
  epochs: 300
  steps_per_epoch: 100
  warmup_steps: 1000
  
  # Curriculum & Physics Loss
  sup_w_start: 10000.0
  sup_w_end: 100.0
  phys_penalty_w: 0.8579

  # Loss Component Weights
  w_linear: 1.0
  w_gradient: 50.0
  w_log_base: 50.0

# =============================================================================
# [Model Architecture]
# =============================================================================
model:
  model_type: "vit"
  
  hidden_dim: 256
  encoder_depth: 6
  n_layers: 2           # [INFO] Total layers (Oxide + Film)
  dropout: 0.15
  
  # Fourier (Disabled)
  mapping_size: 0
  fourier_scale: 50.0
  
  # Transformer Settings
  n_heads: 8
  dim_feedforward: 1024
  activation: "gelu"
  
  # ViT Patching
  patch_size: 16
