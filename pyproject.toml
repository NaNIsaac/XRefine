[project]
name = "xrefine"
version = "0.1.0"
description = "Neural network that predicts thin-film layer parameters from X-ray reflectivity curves, with a differentiable Abeles simulator for refinement"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "torch==2.9.0",
    "tqdm",
    "pandas",
    "seaborn",
    "scipy",
    "pydantic",
    "pyyaml",
    "genx3",
    "lib-platform",
    "loguru>=0.7.3",
    "tensorboard>=2.20.0",
    "typer>=0.21.0",
    "jsonargparse>=4.45.0",
    "optuna>=4.6.0",
    "pywavelets>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# violations present when ruff became mandatory in CI; remove entries as they are fixed
