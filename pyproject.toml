[project]
name = "xrefine"
version = "0.1.0"
description = "Neural network that predicts thin-film layer parameters from X-ray reflectivity curves, with a differentiable Abeles simulator for refinement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "torch==2.9.0",
    "tqdm",
    "pandas",
    "seaborn",
    "scipy",
    "pydantic",
    "pyyaml",
    "genx3",
    "lib-platform",
    "loguru>=0.7.3",
    "tensorboard>=2.20.0",
    "typer>=0.21.0",
    "jsonargparse>=4.45.0",
    "optuna>=4.6.0",
    "pywavelets>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# Broad catches that are the intended behaviour: a CLI falls back to the default config, a
# training run logs and continues past a failed backup or resume, an optimizer objective scores a
# failed trial as a large loss, and a debug or smoke script reports a failure and moves on.
[tool.ruff.lint.extend-per-file-ignores]
"convert_checkpoint.py" = ["BLE001"]
"debug/debug_abeles.py" = ["BLE001"]
"main.py" = ["BLE001"]
"main_enhanced.py" = ["BLE001"]
"test_phase1.py" = ["BLE001"]
"tests/test_enhanced_gradients.py" = ["BLE001"]
"xrefine/hpo.py" = ["BLE001"]
"xrefine/predict_real.py" = ["BLE001"]
"xrefine/refine/pipeline_next.py" = ["BLE001"]
# S110: an unreadable range falls back to (0, 1); an emergency save must not hide the error it
# is saving for, which is re-raised right after.
"xrefine/refine/optimizer.py" = ["BLE001", "S110"]
"xrefine/train/trainer.py" = ["BLE001", "S110"]
